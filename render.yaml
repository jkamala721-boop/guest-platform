services:
  - type: web
    name: hostvero
    runtime: docker
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: MPESA_PAYMENT_MODE
        value: mock
      - key: STRIPE_PAYMENT_MODE
        value: mock
      - key: PAYSTACK_PAYMENT_MODE
        value: live
      - key: RESEND_ENABLED
        value: "true"
      - key: NOTIFICATION_DEFAULT_CHANNEL
        value: EMAIL
      - key: WHATSAPP_ENABLED
        value: "false"
      - key: DB_POOL_MAX_SIZE
        value: "5"
      - key: DB_POOL_MIN_IDLE
        value: "1"
      - key: SUPABASE_DB_JDBC_URL
        sync: false
      - key: SUPABASE_DB_USERNAME
        sync: false
      - key: SUPABASE_DB_PASSWORD
        sync: false
      - key: HOSTVERO_PUBLIC_BASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: HOSTVERO_PAYOUT_FINGERPRINT_SECRET
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
