spring.datasource.url=jdbc:h2:mem:hostvero;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.locations=classpath:db/migration
# The production-only version 2 migration enables PostgreSQL RLS and is not valid H2 SQL.
spring.flyway.target=1
app.auth.session-ttl-hours=1
