spring.datasource.url=jdbc:h2:mem:hostvero;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.locations=classpath:db/core-migration
# PostgreSQL-only RLS migrations remain outside the H2 test migration path.
app.auth.session-ttl-hours=1
app.payments.mpesa.mode=mock
app.payments.mpesa.webhook-secret=phase4-test-mpesa-webhook-secret
app.payments.stripe.mode=mock
app.payments.stripe.webhook-secret=phase4-test-stripe-webhook-secret
app.notifications.mode=mock
# Prevent background execution from racing deterministic scheduler tests.
app.notifications.scheduler.fixed-delay-ms=3600000
app.notifications.payment-reminder-hours-before-checkin=12
app.extensions.reservation-minutes=30
