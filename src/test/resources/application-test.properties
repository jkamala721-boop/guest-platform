spring.datasource.url=jdbc:h2:mem:hostvero;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.locations=classpath:db/core-migration
# PostgreSQL-only RLS migrations remain outside the H2 test migration path.
spring.flyway.target=3
app.auth.session-ttl-hours=1
