# Render supplies PORT and terminates TLS before forwarding requests to this service.
server.port=${PORT:8080}
server.forward-headers-strategy=framework
app.security.cors.allowed-origins=https://app.hostvero.net

# Flyway is the production schema authority. Hibernate only validates its result.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

# Keep web/Actuator error output and health responses safe for public deployment.
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Render captures stdout/stderr. Provider and security code must log only safe diagnostics.
logging.level.root=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
