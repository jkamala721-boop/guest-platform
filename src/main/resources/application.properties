spring.application.name=hostvero
spring.config.import=optional:file:.env[.properties]

# Set these secret values in the environment (or an ignored local .env file), never in Git.
# Copy .env.example and replace its placeholders with values from Supabase Connect.
spring.datasource.url=${SUPABASE_DB_JDBC_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:10000}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/core-migration,classpath:db/postgresql-migration

# Opaque bearer sessions are stored only as hashes. Keep their raw tokens out of logs and Git.
app.auth.session-ttl-hours=${AUTH_SESSION_TTL_HOURS:24}

# Phase 4 starts in mock mode so development and tests never contact payment
# providers. Set the corresponding mode and provider credentials outside Git
# before wiring a live adapter. Webhook secrets are required to accept callbacks.
app.payments.mpesa.mode=${MPESA_PAYMENT_MODE:mock}
app.payments.mpesa.webhook-secret=${MPESA_WEBHOOK_SECRET:}
app.payments.stripe.mode=${STRIPE_PAYMENT_MODE:mock}
app.payments.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}

# Phase 6 delivery is deliberately mock-only until a real provider is approved.
app.notifications.mode=${NOTIFICATION_MODE:mock}
app.notifications.scheduler.fixed-delay-ms=${NOTIFICATION_SCHEDULER_FIXED_DELAY_MS:60000}
app.notifications.payment-reminder-hours-before-checkin=${PAYMENT_REMINDER_HOURS_BEFORE_CHECKIN:12}
app.extensions.reservation-minutes=${EXTENSION_RESERVATION_MINUTES:30}
