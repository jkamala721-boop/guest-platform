spring.application.name=hostvero
spring.config.import=optional:file:.env[.properties]

# Set these secret values in the environment (or an ignored local .env file), never in Git.
# Copy .env.example and replace its placeholders with values from Supabase Connect.
spring.datasource.url=${SUPABASE_DB_JDBC_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:10000}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/core-migration,classpath:db/postgresql-migration

# Opaque bearer sessions are stored only as hashes. Keep their raw tokens out of logs and Git.
app.auth.session-ttl-hours=${AUTH_SESSION_TTL_HOURS:720}
app.auth.cookie-name=${AUTH_COOKIE_NAME:HOSTVERO_SESSION}
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:false}
app.auth.cookie-same-site=${AUTH_COOKIE_SAME_SITE:Lax}

# Payment adapters default to mock mode. Stripe Checkout uses the official SDK
# only when STRIPE_PAYMENT_MODE=live and its credentials are supplied outside Git.
app.payments.mpesa.mode=${MPESA_PAYMENT_MODE:mock}
app.notifications.resend.enabled=${RESEND_ENABLED:true}
app.notifications.resend.api-key=${RESEND_API_KEY:}
app.notifications.resend.from=${RESEND_FROM_EMAIL:onboarding@resend.dev}
app.payments.mpesa.webhook-secret=${MPESA_WEBHOOK_SECRET:}
app.payments.stripe.mode=${STRIPE_PAYMENT_MODE:mock}
app.payments.stripe.secret-key=${STRIPE_SECRET_KEY:}
app.payments.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
app.payments.paystack.mode=${PAYSTACK_PAYMENT_MODE:mock}
app.payments.paystack.secret-key=${PAYSTACK_SECRET_KEY:}
app.payments.paystack.public-key=${PAYSTACK_PUBLIC_KEY:}
app.security.payout-fingerprint-secret=${HOSTVERO_PAYOUT_FINGERPRINT_SECRET:}
# M-Pesa host payouts stay independent from guest payment confirmation. The worker
# waits for the configured settlement hold, checks the platform balance, then reconciles Paystack transfers.
app.payouts.scheduler.enabled=${HOST_PAYOUT_SCHEDULER_ENABLED:true}
app.payouts.scheduler.fixed-delay-ms=${HOST_PAYOUT_SCHEDULER_FIXED_DELAY_MS:300000}
app.payouts.scheduler.batch-size=${HOST_PAYOUT_SCHEDULER_BATCH_SIZE:20}
app.payouts.settlement-hold-minutes=${HOST_PAYOUT_SETTLEMENT_HOLD_MINUTES:1440}
app.payouts.maximum-attempts=${HOST_PAYOUT_MAXIMUM_ATTEMPTS:3}
app.public-base-url=${HOSTVERO_PUBLIC_BASE_URL:http://localhost:8080}

app.security.cors.allowed-origins=${HOSTVERO_CORS_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}
app.security.rate-limit.enabled=${PUBLIC_RATE_LIMIT_ENABLED:true}
app.security.rate-limit.max-buckets=${PUBLIC_RATE_LIMIT_MAX_BUCKETS:10000}
app.security.rate-limit.login.max-requests=${PUBLIC_RATE_LIMIT_LOGIN_MAX_REQUESTS:10}
app.security.rate-limit.login.window-seconds=${PUBLIC_RATE_LIMIT_LOGIN_WINDOW_SECONDS:900}
app.security.rate-limit.registration.max-requests=${PUBLIC_RATE_LIMIT_REGISTRATION_MAX_REQUESTS:5}
app.security.rate-limit.registration.window-seconds=${PUBLIC_RATE_LIMIT_REGISTRATION_WINDOW_SECONDS:3600}
app.security.rate-limit.guest-link.max-requests=${PUBLIC_RATE_LIMIT_GUEST_LINK_MAX_REQUESTS:120}
app.security.rate-limit.guest-link.window-seconds=${PUBLIC_RATE_LIMIT_GUEST_LINK_WINDOW_SECONDS:300}
app.security.rate-limit.otp-request.max-requests=${PUBLIC_RATE_LIMIT_OTP_REQUEST_MAX_REQUESTS:5}
app.security.rate-limit.otp-request.window-seconds=${PUBLIC_RATE_LIMIT_OTP_REQUEST_WINDOW_SECONDS:900}
app.security.rate-limit.otp-verify.max-requests=${PUBLIC_RATE_LIMIT_OTP_VERIFY_MAX_REQUESTS:10}
app.security.rate-limit.otp-verify.window-seconds=${PUBLIC_RATE_LIMIT_OTP_VERIFY_WINDOW_SECONDS:900}
app.security.rate-limit.payment-initialization.max-requests=${PUBLIC_RATE_LIMIT_PAYMENT_MAX_REQUESTS:10}
app.security.rate-limit.payment-initialization.window-seconds=${PUBLIC_RATE_LIMIT_PAYMENT_WINDOW_SECONDS:900}
app.security.rate-limit.paystack-webhook.max-requests=${PUBLIC_RATE_LIMIT_PAYSTACK_WEBHOOK_MAX_REQUESTS:240}
app.security.rate-limit.paystack-webhook.window-seconds=${PUBLIC_RATE_LIMIT_PAYSTACK_WEBHOOK_WINDOW_SECONDS:60}

# Providers coexist when their credentials are configured. Scheduled delivery uses
# the separate default channel; WhatsApp stays disabled unless explicitly enabled.
app.notifications.mode=${NOTIFICATION_MODE:mock}
app.notifications.default-channel=${NOTIFICATION_DEFAULT_CHANNEL:email}
app.notifications.whatsapp.enabled=${WHATSAPP_ENABLED:false}
app.notifications.whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
app.notifications.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
# Set an actively supported Meta Graph API version in deployment configuration.
app.notifications.whatsapp.api-version=${WHATSAPP_API_VERSION:}
app.notifications.whatsapp.manual-template-name=${WHATSAPP_MANUAL_TEMPLATE_NAME:}
app.notifications.whatsapp.guest-link-template-name=${WHATSAPP_GUEST_LINK_TEMPLATE_NAME:}
app.notifications.whatsapp.scheduled-template-name=${WHATSAPP_SCHEDULED_TEMPLATE_NAME:}
app.notifications.whatsapp.language-code=${WHATSAPP_LANGUAGE_CODE:en}
app.notifications.scheduler.fixed-delay-ms=${NOTIFICATION_SCHEDULER_FIXED_DELAY_MS:60000}
app.notifications.payment-reminder-hours-before-checkin=${PAYMENT_REMINDER_HOURS_BEFORE_CHECKIN:12}
app.guest-email-verification.code-ttl-seconds=${GUEST_EMAIL_VERIFICATION_TTL_SECONDS:600}
app.guest-email-verification.resend-cooldown-seconds=${GUEST_EMAIL_VERIFICATION_RESEND_COOLDOWN_SECONDS:60}
app.guest-email-verification.maximum-attempts=${GUEST_EMAIL_VERIFICATION_MAXIMUM_ATTEMPTS:5}
app.extensions.reservation-minutes=${EXTENSION_RESERVATION_MINUTES:30}
